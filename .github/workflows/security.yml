name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # NOTE: Daily at 05:23 CST (11:23 UTC). Off-peak minute per global
    # rule about avoiding :00/:30 cron schedules.
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    # WHY: thin caller of the fleet-canonical reusable (cargo-deny + prebuilt
    # cargo-audit + osv-scanner) instead of a fourth copy-pasted inline block —
    # one fact, one place. Pin includes the prebuilt-cargo-audit fix (#8) that
    # unbroke MSRV-pinned repos like this one (kanon#2385).
    uses: forkwright/.github/.github/workflows/security.yml@764a84135ce378865ade02894a93db3a48042950
    with:
      has_private_deps: false
      run_osv: true
      cargo_audit_timeout_minutes: 15
