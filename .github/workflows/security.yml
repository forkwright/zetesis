name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # NOTE: Daily at 05:23 CST (11:23 UTC). Off-peak minute per global
    # rule about avoiding :00/:30 cron schedules.
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    # WHY: thin caller of the fleet-canonical reusable (cargo-deny + prebuilt
    # cargo-audit + osv-scanner) instead of a fourth copy-pasted inline block —
    # one fact, one place.
    #
    # WHY @main, not the SHA that shipped the prebuilt-cargo-audit fix (#8,
    # kanon#2385): forkwright/.github publishes no tags, so that SHA had no
    # dependabot bump path and just froze here -- 7 weeks behind main by the
    # time this was floated, the oldest pin found across the fleet. main
    # carries #8 and everything after it. forkwright/.github is first-party --
    # same org, same trust boundary -- not the third-party supply-chain case a
    # SHA pin defends against.
    uses: forkwright/.github/.github/workflows/security.yml@main
    with:
      has_private_deps: false
      run_osv: true
      cargo_audit_timeout_minutes: 15
