# WHY: Block merges on known vulnerabilities and license/source/ban
# violations. Runs `cargo audit` (RustSec DB) and `cargo deny check`
# (licenses, sources, bans, advisories) on every PR and daily against main
# so newly-published CVEs against existing deps are caught even when no PR
# is open.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # NOTE: Daily at 05:23 CST (11:23 UTC). Off-peak minute per global
    # rule about avoiding :00/:30 cron schedules.
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    # WHY: checks licenses, banned crates, source registries, and the
    # RustSec advisory DB using deny.toml's ignore list. Any finding fails
    # the job; suppressions require a config entry with a reason.
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2.0.18
        with:
          command: check advisories licenses bans sources
          arguments: --all-features

  cargo-audit:
    # WHY: cargo-deny's advisories check overlaps but uses a different code
    # path; running cargo-audit independently protects against config drift.
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      # WHY: install a PREBUILT cargo-audit binary, not `cargo install` from
      # source — a source build couples cargo-audit's ever-climbing MSRV to
      # this repo's pinned toolchain (rust-toolchain 1.85), which fails both
      # ways (0.22 needs rustc 1.88; 0.21's rustsec can't parse CVSS-4.0
      # advisories now in the DB). The prebuilt binary is toolchain-independent.
      # See kanon#2385.
      - uses: taiki-e/install-action@a416ddeedbd372e614cc1386e8b642692f66865e # v2
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit
        # WHY: -D unmaintained,unsound,yanked escalates those categories
        # to errors. Suppressions go through .cargo/audit.toml.
        run: cargo audit --deny unmaintained --deny unsound --deny yanked
