[workspace]
resolver = "2"
members = [
    "crates/zetesis",
    "crates/sylloge",
    "crates/elenkhos",
    "crates/synopsis",
]

[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/forkwright/zetesis"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"

[workspace.dependencies]
ciborium = "0.2"
futures = "0.3"
jiff = { version = "0.2", features = ["serde"] }
language-tags = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.8"
url = { version = "2", features = ["serde"] }

elenkhos = { version = "0.0.5", path = "crates/elenkhos" }
sylloge = { version = "0.0.5", path = "crates/sylloge" }
synopsis = { version = "0.0.5", path = "crates/synopsis" }

[workspace.dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "sync", "time"]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
