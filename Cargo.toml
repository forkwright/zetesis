[workspace]
resolver = "2"
members = [
    "crates/zetesis",
    "crates/sylloge",
    "crates/elenkhos",
    "crates/synopsis",
]

[workspace.package]
version = "0.0.6"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/forkwright/zetesis"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"

[workspace.dependencies]
ciborium = "0.2"
futures = "0.3"
jiff = { version = "0.2", features = ["serde"] }
language-tags = { version = "0.3", features = ["serde"] }
# WHY: arXiv answers in Atom 1.0 XML (namespaced elements, entity
# references, CDATA), so its parser needs a real XML reader rather than
# string scanning. No default features: no serde bridge, no encoding_rs
# (the Atom feed is UTF-8), no async reader. Held at 0.41 because 0.42
# raises the minimum Rust version past this workspace's `rust-version`.
quick-xml = { version = "0.41", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WHY: the router's cache key is a SHA-256 digest over a domain-separated
# encoding of the normalized query, shape, and constraints. RustCrypto
# `sha2` without default features (no `oid`, no `alloc`) is the hash alone.
sha2 = { version = "0.11", default-features = false }
snafu = "0.9"
url = { version = "2", features = ["serde"] }

elenkhos = { version = "0.0.6", path = "crates/elenkhos" }
sylloge = { version = "0.0.6", path = "crates/sylloge" }
synopsis = { version = "0.0.6", path = "crates/synopsis" }

# WHY: the router bounds each provider attempt and paces requests on the
# tokio clock, so library code needs only `sync` and `time`; runtime and
# test features are added where tests need them.
[workspace.dependencies.tokio]
version = "1"
features = ["sync", "time"]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
