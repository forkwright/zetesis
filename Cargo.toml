[workspace]
resolver = "2"
members = [
    "crates/zetesis",
    "crates/sylloge",
    "crates/elenkhos",
    "crates/synopsis",
]

[workspace.package]
version = "0.0.6"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/forkwright/zetesis"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"

[workspace.dependencies]
ciborium = "0.2"
# WHY: gzip/deflate decoding for bounded static acquisition. The pure-Rust
# miniz_oxide backend only: no C toolchain, no zlib system dependency.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures = "0.3"
# WHY: the WHATWG named character reference table (2,231 entries, legacy
# no-semicolon forms, numeric remapping) for static text extraction.
# Chosen over html-escape, which leaves legacy and remapped references
# undecoded; `unescape` is the only feature used.
htmlize = { version = "1.1", default-features = false, features = ["unescape"] }
jiff = { version = "0.2", features = ["serde"] }
language-tags = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WHY: SHA-256 content identity for evidence digests and fingerprints.
# RustCrypto 0.11 matches the version the first consumer already links.
sha2 = { version = "0.11", default-features = false }
snafu = "0.9"
url = { version = "2", features = ["serde"] }

elenkhos = { version = "0.0.6", path = "crates/elenkhos" }
sylloge = { version = "0.0.6", path = "crates/sylloge" }
synopsis = { version = "0.0.6", path = "crates/synopsis" }

[workspace.dependencies.tokio]
version = "1"
features = ["rt-multi-thread", "macros", "sync", "time"]

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
