[state]
summary = "Zetesis is pre-release. The four-crate workspace carries the sylloge typed surface (provider and deep-research traits, constraints with a fail-closed network-target check, StaticAcquirer for anonymous static GET, citations, results, cost and in-memory budget arithmetic, in-memory LocalDeepResearch with an offline five-node fixture), re-exported by the zetesis facade. StaticAcquirer is the only HTTP client; no provider adapter, cache, durable ledger, or model binding exists. docs/design/contract-baseline.md records what each public type enforces versus caller convention."
current_phase = "Phase 00: contract baseline. S1 reconciles the implemented API and source docs with the accepted consumer boundaries."
updated = "2026-09-25"

[[recent]]
date = "2026-09-25"
item = "Recorded the contract baseline (docs/design/contract-baseline.md): public API inventory with enforced versus convention status, API delta, contract ownership with no consumer cycle, identity and idempotency, evidence envelope v1, resource dimensions, cancellation, error classification, and storage. Retired stale scaffold, paid-fallback, pricing, and host-command guidance across the source docs."

