[[open_threads]]
name = "Bounded static acquisition"
status = "Open, tracked by zetesis#48. Phase 01 S1 landed StaticAcquirer with private one-hop transport, per-hop validation, the Connector seam, and hop records, and retired Crawler and PageContent. Phase 01 S2 adds evidence envelope v1, fingerprint, replay, content decoding, and static extraction. Contract: docs/design/contract-baseline.md sections 7 to 10."

[[open_threads]]
name = "Paid-research authorization"
status = "Open, tracked by zetesis#47 (reopened). Paid use stays disabled until a durable, identity-bound, fleet-scoped reservation ledger exists and authorization is carried through both Provider and DeepResearch. The in-memory BudgetConstraint::try_reserve is not that ledger."

[[open_threads]]
name = "Storage primitive selection"
status = "Phase 03 S1. No primitive is selected and no storage crate is a dependency. Apply the kanon storage decision tree (transactional ledger to pinax, blobs to koina plus fjall); if those are not consumable, the phase is blocked upstream and tracked by an issue here rather than substituted with a raw store. No open issue tracks this yet."

[[open_threads]]
name = "Deep inquiry backend"
status = "Phase 05. No open GitHub issue tracks this yet; file one before resuming and record its number here in prose. Remaining scope: model binding through the consumer-granted model contract (Logismos executes models), search through zetesis providers (SearXNG only as an explicitly registered endpoint), durable task identity with a consumer idempotency key, iteration, source, and token dimensions, and endpoint-backed integration tests. The in-memory lifecycle and offline fixture are in place."
