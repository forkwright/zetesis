# cargo-deny configuration.

[graph]
targets = []
all-features = false

[advisories]
ignore = []

[licenses]
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "LicenseRef-PolyForm-Noncommercial-1.0.0",
    "LicenseRef-PolyForm-Shield-1.0.0",
    "LicenseRef-Proprietary",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
